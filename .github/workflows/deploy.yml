name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'functions/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out latest website
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out current public catalogue
        uses: actions/checkout@v6
        with:
          repository: paintcommons/catalog
          ref: main
          path: .catalog
          persist-credentials: false
      - name: Check for a newer catalogue
        id: freshness
        run: node scripts/check-refresh.mjs "$(git -C .catalog rev-parse HEAD)"
      - name: Validate public catalogue
        if: github.event_name != 'schedule' || steps.freshness.outputs.changed == 'true'
        working-directory: .catalog
        run: node scripts/validate.mjs --base HEAD
      - name: Bundle catalogue and attribution
        id: bundle
        if: github.event_name != 'schedule' || steps.freshness.outputs.changed == 'true'
        run: node scripts/sync-catalog.mjs .catalog --wait-for-ids
      - name: Test website against refreshed data
        if: steps.bundle.outputs.ready == 'true'
        run: npm test
      - name: Check deployment credentials
        if: steps.bundle.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare deployment credentials are missing.'
            exit 1
          fi
      - name: Deploy production website
        if: steps.bundle.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.164.0'
          command: pages deploy dist --project-name paintcommons --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
