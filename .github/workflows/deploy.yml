name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the triggering website revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit attribution
        run: python3 scripts/attribution/guard.py ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out current public catalogue
        uses: actions/checkout@v6
        with:
          repository: paintcommons/catalog
          ref: main
          path: .catalog
          persist-credentials: false
      - name: Check for a newer catalogue
        id: freshness
        run: node scripts/check-refresh.mjs "$(git -C .catalog rev-parse HEAD)"
      - name: Validate public catalogue
        if: github.event_name != 'schedule' || steps.freshness.outputs.changed == 'true'
        working-directory: .catalog
        run: node scripts/validate.mjs --base HEAD
      - name: Bundle catalogue and attribution
        id: bundle
        if: github.event_name != 'schedule' || steps.freshness.outputs.changed == 'true'
        run: node scripts/sync-catalog.mjs .catalog --wait-for-ids
      - name: Test website against refreshed data
        if: steps.bundle.outputs.ready == 'true'
        run: npm test
      - name: Check deployment credentials
        if: steps.bundle.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare deployment credentials are missing.'
            exit 1
          fi
      - name: Check production revision
        if: steps.bundle.outputs.ready == 'true'
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Superseded by a newer main commit; this run will not deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record release revisions
        if: steps.revision.outputs.current == 'true'
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const catalogue = JSON.parse(readFileSync("dist/data/catalogue-version.json", "utf8"));
            writeFileSync("dist/deployment.json", JSON.stringify({commit:process.env.GITHUB_SHA,catalogueRevision:catalogue.revision}) + "\n");
          '
      - name: Deploy production website
        if: steps.revision.outputs.current == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.164.0'
          command: pages deploy dist --project-name paintcommons --branch main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the deployed revisions
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 \
            "$DEPLOYMENT_URL/deployment.json" -o "$RUNNER_TEMP/deployment.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const actual = JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/deployment.json", "utf8"));
            const expected = JSON.parse(readFileSync("dist/data/catalogue-version.json", "utf8"));
            if (actual.commit !== process.env.GITHUB_SHA || actual.catalogueRevision !== expected.revision) throw Error("Deployed revisions do not match this run");
          '
          {
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Catalogue: \`$(git -C .catalog rev-parse HEAD)\`"
            echo "Deployment: $DEPLOYMENT_URL"
            echo 'Production: https://paintcommons.org'
          } >> "$GITHUB_STEP_SUMMARY"
