name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'functions/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable automatic deployments. See README.md.'
          fi
      - name: Check out website
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v6
      - name: Deploy production website
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.164.0'
          command: pages deploy dist --project-name paintcommons --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
